<text x="28" y="42" fill="#f0efec" font-size="24" font-weight="700" text-anchor="start">Speed</text>
<text x="28" y="63" fill="#9a998f" font-size="13" font-weight="400" text-anchor="start">Shorter is faster. ucu runs the Codex engine: it waits 20 ms after an action to catch error sounds, and other gaps are noise.</text>
