<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 385" width="860" height="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Speed: longer jobs">
<title>Speed: longer jobs</title>
<rect x="0.5" y="0.5" width="859" height="384" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28" y="42" fill="#0b0b0b" font-size="24" font-weight="700" text-anchor="start">Speed: longer jobs</text>
<text x="28" y="63" fill="#74736e" font-size="13" font-weight="400" text-anchor="start">Shorter is faster. UCU runs the Codex engine, so those two differ only by noise.</text>
