<text x="28" y="146.0" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start">Finish a task</text><text x="28" y="163.0" fill="#74736e" font-size="12" font-weight="400" text-anchor="start">12 + 34 = in Calculator</text><path d="M236 124h428.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-428.0z" fill="#0b0b0b"/><text x="675.9574468085107" y="135.5" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">1.0 s</text><path d="M236 141h436.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-436.0z" fill="#2a78d6"/><text x="684.0" y="152.5" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">1.0 s</text><path d="M236 158h192.8a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-192.8z" fill="#b4b3ab"/><text x="440.8085106382979" y="169.5" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">462 ms</text><text x="28" y="224.5" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start">Read a large window</text><text x="28" y="241.5" fill="#74736e" font-size="12" font-weight="400" text-anchor="start">Font Book</text><path d="M236 194h207.2a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-207.2z" fill="#0b0b0b"/><text x="455.20578091640664" y="205.5" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">1.5 s</text><path d="M236 211h225.2a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-225.2z" fill="#2a78d6"/><text x="473.1844309410412" y="222.5" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">1.6 s</text><path d="M236 228h436.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-436.0z" fill="#b4b3ab"/><text x="684.0" y="239.5" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">3.0 s</text><path d="M236 245h19.8a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-19.8z" fill="#b4b3ab"/><text x="267.7740187222861" y="256.5" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">164 ms (outline only)</text><text x="28" y="303.0" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start">Start from nothing</text><text x="28" y="320.0" fill="#74736e" font-size="1