<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 385" width="860" height="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Speed: longer jobs">
<title>Speed: longer jobs</title>
<rect x="0.5" y="0.5" width="859" height="384" rx="14" fill="#1a1a19" stroke="#383835"/>
<text x="28" y="42" fill="#f0efec" font-size="24" font-weight="700" text-anchor="start">Speed: longer jobs</text>
<text x="28" y="63" fill="#9a998f" font-size="13" font-weight="400" text-anchor="start">Shorter is faster. UCU runs the Codex engine, so those two differ only by noise.</text>
