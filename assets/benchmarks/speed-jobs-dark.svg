<text x="28" y="146.0" fill="#f0efec" font-size="15" font-weight="600" text-anchor="start">Finish a task</text><text x="28" y="163.0" fill="#9a998f" font-size="12" font-weight="400" text-anchor="start">12 + 34 = in Calculator</text><path d="M236 124h435.9a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-435.9z" fill="#f0efec"/><text x="683.905895772439" y="135.5" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">1.4 s</text><path d="M236 141h436.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-436.0z" fill="#3987e5"/><text x="684.0" y="152.5" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">1.4 s</text><path d="M236 158h240.7a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-240.7z" fill="#77766f"/><text x="488.7023597347972" y="169.5" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">780 ms</text><text x="28" y="224.5" fill="#f0efec" font-size="15" font-weight="600" text-anchor="start">Read a large window</text><text x="28" y="241.5" fill="#9a998f" font-size="12" font-weight="400" text-anchor="start">Font Book</text><path d="M236 194h297.4a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-297.4z" fill="#f0efec"/><text x="545.3748072316829" y="205.5" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">2.1 s</text><path d="M236 211h265.8a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-265.8z" fill="#3987e5"/><text x="513.8441447649047" y="222.5" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">1.9 s</text><path d="M236 228h436.0a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-436.0z" fill="#77766f"/><text x="684.0" y="239.5" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">3.0 s</text><path d="M236 245h20.5a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-20.5z" fill="#77766f"/><text x="268.45647537487287" y="256.5" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">169 ms (outline only)</text><text x="28" y="303.0" fill="#f0efec" font-size="15" font-weight="600" text-anchor="start">Start from nothing</text><text x="28" y="320.0" fill="#9a998f" font-size="12